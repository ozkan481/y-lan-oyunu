<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Yılan Oyunu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .score-box {
            background: #0f172a;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #475569;
        }

        canvas {
            background-color: #020617;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            border: 2px solid #334155;
        }

        .btn {
            margin-top: 15px;
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #16a34a;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .instructions {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SNAKE GAME</h1>
        <div class="score-board">
            <div class="score-box">Skor: <span id="score">0</span></div>
            <div class="score-box">En Yüksek: <span id="highScore">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <button class="btn" id="startBtn">Oyunu Başlat</button>
        <div class="instructions">Kontrol: Yön Tuşları veya W, A, S, D</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const startBtn = document.getElementById("startBtn");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameInterval = null;
        let isGameRunning = false;
        let changingDirection = false; // Tuş spam'ini önlemek için

        highScoreElement.textContent = highScore;

        startBtn.addEventListener("click", resetGame);

        function resetGame() {
            snake = [
                { x: 160, y: 200 },
                { x: 140, y: 200 },
                { x: 120, y: 200 }
            ];
            score = 0;
            scoreElement.textContent = score;
            dx = gridSize;
            dy = 0;
            isGameRunning = true;
            startBtn.style.display = "none";
            createFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(main, 100);
        }

        function main() {
            if (hasGameEnded()) {
                endGame();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#38bdf8" : "#22c55e"; // Kafa mavi, gövde yeşil
                ctx.strokeStyle = "#0f172a";
                ctx.fillRect(part.x, part.y, gridSize, gridSize);
                ctx.strokeRect(part.x, part.y, gridSize, gridSize);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreElement.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem("snakeHighScore", highScore);
                }
                createFood();
            } else {
                snake.pop();
            }
        }

        function randomFood(min, max) {
            return Math.round((Math.random() * (max - min) + min) / gridSize) * gridSize;
        }

        function createFood() {
            food.x = randomFood(0, canvas.width - gridSize);
            food.y = randomFood(0, canvas.height - gridSize);

            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) createFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#ef4444"; // Kırmızı yem
            ctx.shadowColor = "#ef4444";
            ctx.shadowBlur = 10;
            ctx.fillRect(food.x, food.y, gridSize, gridSize);
            ctx.shadowBlur = 0; // Diğer öğeleri etkilememesi için sıfırla
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height;

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        function endGame() {
            isGameRunning = false;
            clearInterval(gameInterval);
            startBtn.textContent = "Tekrar Başla";
            startBtn.style.display = "inline-block";
        }

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            if (!isGameRunning || changingDirection) return;

            const keyPressed = event.keyCode;
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;
            const W = 87, A = 65, S = 83, D = 68;

            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if ((keyPressed === LEFT || keyPressed === A) && !goingRight) {
                dx = -gridSize;
                dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === UP || keyPressed === W) && !goingDown) {
                dx = 0;
                dy = -gridSize;
                changingDirection = true;
            }
            if ((keyPressed === RIGHT || keyPressed === D) && !goingLeft) {
                dx = gridSize;
                dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === DOWN || keyPressed === S) && !goingUp) {
                dx = 0;
                dy = gridSize;
                changingDirection = true;
            }
            
            // Yön tuşlarının sayfayı kaydırmasını engelle
            if([LEFT, UP, RIGHT, DOWN, 32].includes(keyPressed)) {
                event.preventDefault();
            }
        }
    </script>
</body>
</html>
